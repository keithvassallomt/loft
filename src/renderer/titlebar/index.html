<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="titlebar.css" />
  </head>
  <body>
    <div class="titlebar">
      <div class="left"><img id="icon" alt="" hidden /><span id="name">Loft</span></div>
      <div class="drag"></div>
      <div class="controls">
        <button id="attach" title="Attach to Loft — click, or drag onto the Loft rail" draggable="true" hidden>⇤</button>
        <button id="add-to-grid" title="Add a service to the grid" hidden>＋</button>
        <button id="reload" title="Reload">⟳</button>
        <button id="zoom-out" title="Smaller text">A<span class="arr">▾</span></button>
        <button id="zoom-in" title="Larger text">A<span class="arr">▴</span></button>
        <button id="close" title="Hide to tray">✕</button>
      </div>
    </div>
    <script src="titlebar.js"></script>
  </body>
</html>
