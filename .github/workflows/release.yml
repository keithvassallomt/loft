name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install packaging tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm appstream flatpak flatpak-builder

      - name: Validate AppStream metainfo
        if: github.ref_type == 'tag'
        run: appstreamcli validate --no-net data/chat.loft.Loft.metainfo.xml

      - name: Install, test, build (electron)
        run: |
          npm ci
          npm test
          npm run check
          npm run build

      - name: Package deb/rpm/AppImage
        # --publish never: on a tag build electron-builder otherwise starts its own
        # GitHub publish (and fails for want of GH_TOKEN). The release is published
        # by the action-gh-release step below, from all four artifacts at once.
        run: npx electron-builder --linux deb rpm AppImage --publish never

      # Versions are READ FROM THE MANIFEST, never hardcoded. They were pinned to 24.08
      # here while the manifest moved to 25.08, which would have installed the wrong
      # runtimes and failed the Flatpak build at tag time — i.e. mid-release. One source
      # of truth removes the whole class of drift.
      - name: Set up Flatpak runtimes
        run: |
          set -euo pipefail
          RUNTIME_VERSION=$(sed -n "s/^runtime-version: *'\([^']*\)'.*/\1/p" chat.loft.Loft.yml)
          BASE_VERSION=$(sed -n "s/^base-version: *'\([^']*\)'.*/\1/p" chat.loft.Loft.yml)
          test -n "$RUNTIME_VERSION" && test -n "$BASE_VERSION"
          echo "runtime=$RUNTIME_VERSION base=$BASE_VERSION"
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user flathub \
            "org.freedesktop.Platform//$RUNTIME_VERSION" \
            "org.freedesktop.Sdk//$RUNTIME_VERSION" \
            "org.electronjs.Electron2.BaseApp//$BASE_VERSION" \
            "org.freedesktop.Sdk.Extension.node22//$RUNTIME_VERSION"

      # On a tag, build the manifest EXACTLY as FriendlyHub gets it — git source pinned to
      # this tag. That is the only step that proves the submitted manifest builds; the old
      # `type: dir` source always resolved here (CI has a full checkout) and so hid the
      # missing-source bug that failed the 1.0.0 FriendlyHub build.
      # A dispatch preview has no tag to pin, so it builds the generated working-tree
      # manifest instead.
      - name: Build Flatpak bundle
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            MANIFEST=chat.loft.Loft.yml
          else
            npm run flatpak:dev
            MANIFEST=chat.loft.Loft.dev.yml
          fi
          flatpak-builder --user --force-clean --repo=.flatpak-repo build-dir "$MANIFEST"
          flatpak build-bundle .flatpak-repo Loft.flatpak chat.loft.Loft

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'preview' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Preview build' }}
          prerelease: ${{ github.ref_type != 'tag' }}
          files: |
            dist-electron/*.deb
            dist-electron/*.rpm
            dist-electron/*.AppImage
            Loft.flatpak
