app-id: chat.loft.Loft
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
command: loft

finish-args:
  # Display / GPU / IPC — Electron + Chromium.
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  # Audio in/out. REQUIRED: Chromium's audio process renders INSIDE this sandbox now.
  # Without it ALSA's pulse plugin can't reach the sound server ("Connection refused"),
  # and libpulse's error path close()s FDs Chromium owns -> "Crashing due to FD ownership
  # violation". It also silently kills call audio, the mic, and notification sounds.
  # (Maps to the PulseAudio socket, which pipewire-pulse provides on PipeWire systems.)
  # The old Rust build never needed this: it ran Chrome on the HOST via flatpak-spawn,
  # so audio/camera came from outside the sandbox. Removing that escape moved rendering
  # in here, and these permissions have to be requested explicitly.
  - --socket=pulseaudio
  # Devices: GPU (/dev/dri) AND the camera (/dev/video*) for video calls.
  #
  # `all` is not laziness — it is the only option, re-verified 2026-07-25:
  #   * flatpak has NO camera device value, at any version. `flatpak run --device=camera`
  #     answers "valid types are: dri, all, kvm, shm, input, usb" (flatpak 1.18.0), and
  #     --device=dri binds /dev/dri, /dev/udmabuf, /dev/mali*, /dev/nvidia* — NOT
  #     /dev/video*. A camera-only value was requested in flatpak#1715 and closed
  #     WONTFIX; upstream's answer was the Camera portal instead.
  #   * The Camera portal is not usable here yet. Chromium only takes that path behind
  #     the WebRtcPipeWireCamera feature, which is FEATURE_DISABLED_BY_DEFAULT in the
  #     Chromium 150 that Electron 43 ships (expiry milestone 160 — upstream cites "no
  #     test coverage yet", and it regressed fully in M127 and again in M131). The code
  #     IS compiled into our binary (strings on node_modules/electron/dist/electron finds
  #     WebRtcPipeWireCamera, org.freedesktop.portal.Camera, OpenPipeWireRemote,
  #     AccessCamera) — it is simply switched off.
  #   * Worse than "off": the V4L2 fallback only triggers when PipeWire init returns
  #     UNAVAILABLE. If PipeWire initialises but exposes no camera nodes, you get zero
  #     cameras and NO fallback — and with --device=dri there'd be no /dev/video* to fall
  #     back to (cf. flathub/com.google.Chrome#480, open, Fedora 43 GNOME Wayland).
  #
  # Not a linter failure either: flatpak-builder-lint has no rule for device=all, and
  # Flathub's own com.google.Chrome manifest still ships it.
  #
  # To revisit later: set `enable-features=WebRtcPipeWireCamera` via app.commandLine
  # (Loft currently sets no Chromium switches) while KEEPING --device=all, confirm cameras
  # still enumerate, and only then narrow to --device=dri. Needs no new finish-args — the
  # Camera portal lives on the portal bus name, which is granted by default.
  - --device=all
  # The messaging web apps need the network.
  - --share=network
  # Tray icons (SNI), KDE window control, and desktop notifications.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.kde.KWin
  - --talk-name=org.freedesktop.Notifications
  # GNOME Shell extension helper (install via EGO + drive FocusWindow/HideWindow).
  - --talk-name=org.gnome.Shell.Extensions
  # The helper's OWN bus name, exported by the extension inside gnome-shell. This must be
  # listed explicitly and is easy to lose: it used to be covered incidentally by
  # `--own-name=chat.loft.*`, because an own rule also implies talk/see for every matching
  # name. Dropping that wildcard (the app owns only its app id) therefore silently removed
  # talk access to a name Loft never owned — every call returned ServiceUnknown, which is
  # how xdg-dbus-proxy reports a filtered name rather than AccessDenied, so it reads like
  # "the extension isn't installed". Symptom: no panel tray icon on GNOME. The app id
  # default grant covers chat.loft.Loft and chat.loft.Loft.*, NOT the sibling
  # chat.loft.ShellHelper.
  - --talk-name=chat.loft.ShellHelper
  # No --talk-name for org.freedesktop.portal.* and no --own-name for the app id itself:
  # flatpak grants both to every sandboxed app by default, so listing them is redundant
  # (flatpak-builder-lint: finish-args-portal-talk-name, finish-args-unnecessary-appid-
  # own-name). Loft's portal use — Background (autostart), Settings (live theme),
  # ScreenCast (screen share), FileChooser/OpenURI — needs no grant here.
  #
  # The old Rust build owned one bus name per service (chat.loft.WhatsApp, chat.loft.Tray,
  # …) behind a `--own-name=chat.loft.*` wildcard. The Electron app exports exactly one
  # name, `chat.loft.Loft`, with per-service D-Bus OBJECTS under it (CLAUDE.md "D-Bus
  # Interface") — and that one is the app id, hence granted by default. The wildcard is
  # gone rather than narrowed.
  #
  # KNOWN GAP — the SNI tray cannot own its bus name under Flatpak, and there is no
  # finish-args fix. src/main/tray/watcher.ts calls requestName for
  # `org.kde.StatusNotifierItem-<pid>-1` (per the StatusNotifierItem spec). That is outside
  # chat.loft.*, so the old `--own-name=chat.loft.*` wildcard never covered it either — the
  # request has always been denied in the sandbox. It cannot be granted: flatpak's own-name
  # wildcards only match dot-separated subnames (`foo.bar.*`), and flatpak-builder rejects
  # `org.kde.StatusNotifierItem-*` outright with "Invalid dbus name"; the PID in the middle
  # makes a literal grant impossible anyway.
  #
  # Invisible on GNOME — trayBackend=auto picks the Shell-helper panel there, so the SNI
  # path never runs — but it means no tray on KDE and other desktops under Flatpak.
  #
  # The fix is in code, not here: RegisterStatusNotifierItem accepts the caller's UNIQUE
  # bus name (dbus-next exposes it as `bus.name`, e.g. ":1.42"), so dropping the
  # requestName call removes the need for any grant. Not done yet — it needs testing on a
  # real KDE/SNI desktop, which the GNOME dev box cannot provide.
  # Autostart .desktop files and per-service launcher .desktop files.
  # The Background portal writes OUR autostart entry (chat.loft.Loft.desktop) — this
  # grant is deliberately NOT used for that, and must not be. Flatpak bind-mounts the
  # host ~/.config/autostart over $XDG_CONFIG_HOME/autostart, so the app's computed
  # path sees the real host dir. Three things need it, none of which a portal covers:
  #   1. read back whether autostart is actually in effect (isAutostartEnabled)
  #   2. delete our OWN v1-era leftovers (loft-<service>.desktop) — the portal only
  #      manages its own <app-id>.desktop, and deleting needs a writable PARENT dir,
  #      so no narrower grant works (verified: :ro gives EROFS on unlink)
  #   3. :create (not :rw) guarantees the dir exists — Flatpak cannot bind a source
  #      that is missing at launch, and without the bind isAutostartEnabled() reads
  #      false all session and the hub shows a spurious "not allowed to start at login"
  - --filesystem=xdg-config/autostart:create
  - --filesystem=xdg-data/applications:create

build-options:
  append-path: /usr/lib/sdk/node22/bin
  env:
    npm_config_nodedir: /usr/lib/sdk/node22

modules:
  - name: loft
    buildsystem: simple
    build-options:
      env:
        # flatpak-node-generator lays the offline caches under the build root:
        #   flatpak-node/npm-cache  -> npm's _cacache (registry tarballs)
        #   flatpak-node/cache      -> XDG cache (electron zip, node-gyp headers, esbuild)
        XDG_CACHE_HOME: /run/build/loft/flatpak-node/cache
        npm_config_cache: /run/build/loft/flatpak-node/npm-cache
        npm_config_offline: 'true'
    build-commands:
      # Clean, reproducible install straight from the offline cache (every npm
      # tarball is seeded into flatpak-node/npm-cache by generated-sources.json).
      - npm ci --offline
      # Electron 43 has NO postinstall: its index.js downloads the prebuilt
      # binary lazily on the first `require('electron')`. Nothing in the build
      # below (tsc/esbuild/vite, all with electron marked external) requires
      # electron, so npm ci alone never materialises the binary. Run the
      # installer explicitly: it resolves electron-v43…-linux-<arch>.zip from the
      # seeded @electron/get cache ($XDG_CACHE_HOME/electron, populated by
      # generated-sources.json) with no network and unpacks it into
      # node_modules/electron/dist/ (also writing path.txt).
      - node node_modules/electron/install.js
      - npm run build
      # Assemble the app tree that the launcher runs (package.json "main" ->
      # dist/main/index.js; the Electron binary lives in node_modules/electron/dist).
      - mkdir -p /app/main
      - cp -r dist package.json node_modules /app/main/
      # zypak launcher, exposed as the `loft` command.
      - install -Dm755 flatpak/loft-launcher.sh /app/bin/loft
      # Desktop integration metadata.
      - install -Dm644 data/chat.loft.Loft.desktop /app/share/applications/chat.loft.Loft.desktop
      - install -Dm644 data/chat.loft.Loft.metainfo.xml /app/share/metainfo/chat.loft.Loft.metainfo.xml
      - install -Dm644 build/icon.png /app/share/icons/hicolor/512x512/apps/chat.loft.Loft.png
    sources:
      # This manifest is uploaded to FriendlyHub verbatim, and FriendlyHub builds it in a
      # directory holding ONLY the manifest + its companion files — there is no checkout.
      # So the app source MUST be `type: git` ("not `type: dir`", per FriendlyHub's own
      # submission rules): a `type: dir` source resolves to nothing on their builder, and
      # the first build command dies with "npm ci can only install with an existing
      # package-lock.json". `npm run flatpak:dev` regenerates the block below as a
      # working-tree `type: dir` source for local iteration — do not hand-edit it here.
      # >>> app source (generated: scripts/flatpakDevManifest.mjs) >>>
      # `commit` alongside `tag` on purpose: a tag is a moveable reference, so a tag-only
      # source is not a reproducible build (flatpak-builder-lint:
      # module-loft-source-git-no-commit-with-tag). Both must be bumped together on release.
      - type: git
        url: https://github.com/keithvassallomt/loft.git
        tag: v1.0.0
        commit: 7199b83f11edbcc0aadbf29250d64720b1574ba8
      # <<< app source <<<
      # Companion files land flat next to the manifest in the FriendlyHub build repo, so
      # this reference must stay a bare filename — hence the file lives at the repo root
      # rather than under flatpak/.
      - generated-sources.json
